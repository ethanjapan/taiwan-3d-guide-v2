<style>
  /* ============ 3 つの案(色・字・形)。色は台湾の物から取る ============ */
  /* 1 藍鵲(ヤマムスメ): 国鳥の青・くちばしの朱・目の黄 */
  [data-look="1"] { --bg: #1c3db4; --bg2: #10226f; --ink: #f4f1e6; --dim: #a8b9f2; --hot: #ff4a2b; --sub: #ffd53e; --on-hot: #fff6ea; --on-sub: #10226f;
    --lo: #0d1d66; --hi: #ffe4cf; --side: #a3260f;
    --disp: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; --dw: 900; --dls: -.05em;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; --num: "Big Shoulders Display", "Zen Kaku Gothic New", sans-serif;
    --lab: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; --mapf: none; --r: 0px; }
  /* 2 花磚(タイル): 古い家の窓辺のタイルの翡翠・からし・桃 */
  [data-look="2"] { --bg: #0e5f58; --bg2: #073a35; --ink: #fcf3da; --dim: #9fd0c3; --hot: #f7a91c; --sub: #f58fa5; --on-hot: #073a35; --on-sub: #073a35;
    --lo: #06302c; --hi: #fdeab6; --side: #a56a05;
    --disp: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --dw: 900; --dls: -.02em;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --num: "Zen Maru Gothic", sans-serif;
    --lab: "Zen Maru Gothic", sans-serif; --mapf: hue-rotate(-32deg) saturate(.8) brightness(1.03); --r: 26px; }
  /* 3 夜市: 夜の屋台の電光板の桃・黄緑 */
  [data-look="3"] { --bg: #120e1c; --bg2: #1e1730; --ink: #f5f0ff; --dim: #9488b3; --hot: #ff2f8e; --sub: #c8ff3a; --on-hot: #120e1c; --on-sub: #120e1c;
    --lo: #0c0816; --hi: #ff9ccb; --side: #8a0f48;
    --disp: "Reggae One", "Hiragino Sans", sans-serif; --dw: 400; --dls: -.02em;   /* 2026-11-14: Dela Gothic One は「南」の中がつぶれて見えたので替えた(iOS で見くらべ) */
    --body: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; --num: "DotGothic16", monospace;
    --lab: "DotGothic16", "Hiragino Sans", monospace; --mapf: brightness(.5) contrast(1.3) saturate(1.6) hue-rotate(38deg); --r: 0px; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; } html { overflow-x: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  img { display: block; }
  :focus-visible { outline: 3px solid var(--sub); outline-offset: 2px; }   /* 2026-11-15: キーで動かした時に今どこにいるかが見えなかった(既定の輪は地の色に溶けた) */
  :focus:not(:focus-visible) { outline: none; }
  .p > span { display: inline-block; }                       /* 語の途中で折らない= 文節の塊を並べる */
  ck-w { display: inline; } ck-c { display: inline-block; white-space: nowrap; } ck-c.s { white-space: normal; }   /* P() を通さずに出た文字の塊(下の autoChunk が包む)。span にしない= 「.nums2 span { display: block }」のような子孫の指定に当たって塊が縦に並んだ(2026-11-15)。max-width も付けない(欄が文字 1 つ分まで縮んだ)。nowrap= 横並びの店の名のボタンで欄が 1 字まで縮み、塊の中で「燒/餅」と折れた */
  .scr { display: none; } .scr.on { display: block; }
  .lab { font-family: var(--lab); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
  /* 写真を案の 2 色に刷り直す */
  .duo { position: absolute; inset: 0; overflow: hidden; background: var(--lo); isolation: isolate; }
  .duo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.25) brightness(1.05); opacity: 0; transition: opacity .9s ease; }
  .duo img.on { opacity: 1; animation: drift 22s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1.06) translate(-1.5%, 0); } to { transform: scale(1.16) translate(1.5%, -1.5%); } }
  .duo::before { content: ""; position: absolute; inset: 0; background: var(--hi); mix-blend-mode: darken; z-index: 1; }
  .duo::after { content: ""; position: absolute; inset: 0; background: var(--lo); mix-blend-mode: lighten; z-index: 2; }

  /* ============ 模型の舞台 ============ */
  #map { position: fixed; inset: 0; height: 100svh; overflow: hidden; }
  #map .veil { position: absolute; inset: 0; z-index: 1; background: linear-gradient(to bottom, transparent 30%, var(--lo) 86%); opacity: .9; }
  .ghost { position: relative; margin: 0 0 4px 9px; font-family: var(--disp); font-weight: var(--dw); letter-spacing: var(--dls);
           font-size: 35vw; line-height: .95; white-space: nowrap; color: var(--ink); transition: opacity .35s, transform .7s cubic-bezier(.2, .7, .2, 1); }
  .ghost.l3 { font-size: 24vw; }
  .ghost.out { opacity: 0; transform: translateX(-6vw); }
  .world { position: absolute; z-index: 3; left: 0; right: 0; top: 0; bottom: 0; perspective: 900px; perspective-origin: 50% 30%; pointer-events: none; }
  .sway { position: absolute; inset: 0; transform-style: preserve-3d; animation: sway 16s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotateY(-5deg); } to { transform: rotateY(5deg); } }
  .plane { position: absolute; width: 74vw; aspect-ratio: 1200 / 1631; left: 13vw; top: 13svh; transform-style: preserve-3d; pointer-events: auto;
           transform-origin: 55% 50%; transform: translate3d(0, 0, 0) rotateX(56deg) rotateZ(-12deg) scale(1.02);
           transition: transform 1.1s cubic-bezier(.3, .1, .2, 1), transform-origin 1.1s cubic-bezier(.3, .1, .2, 1); }
  #map.intro .plane { transform: translate3d(0, 6svh, -500px) rotateX(0deg) rotateZ(0deg) scale(.7); transition: none; opacity: 0; }
  .plane.go { opacity: 1; }
  #map.dive .plane { transition: transform .8s cubic-bezier(.6, 0, .9, .4); }
  .plane > img, .plane > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plane > img { filter: var(--mapf); }
  .plane::before, .plane::after { content: ""; position: absolute; inset: 0; background: #a39d8f; transform: translateZ(-6px); }   /* 板の厚み */
  .plane::before { background: #7d776b; transform: translateZ(-12px); box-shadow: 0 50px 70px rgba(0, 0, 0, .5); }
  .plane > canvas.tint { opacity: 1; }
  .cells { position: absolute; inset: 0; }
  .cells i { position: absolute; display: block; }
  .lift { position: absolute; transform-style: preserve-3d; --z: 0px; pointer-events: none; }
  .lift > * { position: absolute; inset: 0; width: 100%; height: 100%; background-size: 100% 100%; transition: transform .9s cubic-bezier(.2, .9, .2, 1.15); }
  .lift .top { filter: var(--mapf); } .lift .col { opacity: .6; }
  .lift .shade { transform: translateZ(1px); opacity: .45; filter: blur(5px); }
  /* 隅の小さな表示 */
  .hud { position: absolute; z-index: 5; font-family: var(--lab); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; color: var(--ink); line-height: 1.7; }
  .hud.tl { left: 0; top: calc(12px + env(safe-area-inset-top)); } .hud.tr { right: 0; top: calc(12px + env(safe-area-inset-top)); text-align: right; }
  .hud > * { display: table; background: var(--lo); padding: 5px 10px 6px 14px; margin-bottom: 2px; }   /* 写真の上でも読めるよう、字の下に地を敷く */
  .hud.tr > * { margin-left: auto; padding: 5px 14px 6px 10px; }
  .hud.tr > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; padding-bottom: 0; border-bottom: 6px solid var(--lo); width: fit-content; max-width: 60vw; word-break: keep-all; overflow-wrap: anywhere; }   /* 英語などで写真の札が長いと、左の「11 / 22」の札に重なる(2026-11-14 iPhone で確認)→ 幅を切って語の切れ目で折り、3 行目は出さない(下のボタンがコンパスにかかる)*/
  .hud b { font-weight: 900; font-size: 12.5px; letter-spacing: .12em; } .hud em { font-style: normal; color: var(--sub); }
  /* 下の札: えらんだ県 */
  .dock { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; padding: 0 0 calc(10px + env(safe-area-inset-bottom)); }
  .pick { margin: 0 14px; display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 10px; }
  .pick .zy { font-family: "PingFang TC", "Hiragino Sans", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .3em; color: var(--sub); }
  .pick .meta { font-family: var(--lab); font-size: 11px; font-weight: 700; letter-spacing: .1em; margin-top: 6px; }
  .pick .meta u { text-decoration: none; background: var(--hot); color: var(--on-hot); padding: 3px 7px 4px; margin-right: 8px; }
  .pick .meta u.w { background: var(--sub); color: var(--on-sub); }
  .pick .nums { text-align: right; font-family: var(--num); font-weight: 900; font-size: 30px; line-height: 1; color: var(--sub); }
  .pick .nums small { font-family: var(--body); font-size: 11px; font-weight: 900; color: var(--ink); margin-left: 3px; }
  .pick .nums span { display: block; font-family: var(--lab); font-size: 9.5px; letter-spacing: .1em; color: var(--dim); font-weight: 700; margin: 4px 0 8px; }
  .open { position: relative; overflow: hidden; margin: 12px 14px 0; width: calc(100% - 28px); background: var(--hot); color: var(--on-hot); padding: 15px 16px; font-size: 16px; font-weight: 900; letter-spacing: .06em;
          display: flex; justify-content: space-between; align-items: center; border-radius: calc(var(--r) / 2) 0 calc(var(--r) / 2) 0; }
  .open.w { background: var(--ink); color: var(--lo); }
  .open s, .studio a s { text-decoration: none; display: block; width: 10px; height: 10px; border-top: 3px solid currentColor; border-right: 3px solid currentColor; transform: rotate(45deg); margin-right: 4px; }
  .strip { margin-top: 12px; display: flex; gap: 6px; overflow-x: auto; padding: 0 14px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-padding: 0 14px; }
  .strip::-webkit-scrollbar { display: none; }
  .tile { flex: 0 0 auto; width: 66px; padding: 7px 6px 8px; background: var(--bg2); text-align: center; position: relative; border-radius: 0 calc(var(--r) / 2) 0 calc(var(--r) / 2); }
  .tile .no { font-family: var(--num); font-size: 10px; font-weight: 900; color: var(--dim); display: block; text-align: left; letter-spacing: .06em; }
  .tile .sh { display: block; width: 34px; height: 34px; margin: 2px auto 4px; background: var(--dim); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .tile b { display: block; font-size: 12.5px; font-weight: 900; white-space: nowrap; }
  .tile.v .sh { background: var(--hot); } .tile.v .no { color: var(--hot); }
  .tile.sel { background: var(--ink); color: var(--lo); } .tile.sel .sh { background: var(--lo); } .tile.sel .no { color: var(--lo); }
  .tile.sel.v .sh { background: var(--hot); }
  [data-look="3"] .tile { background: none; box-shadow: inset 0 0 0 1.5px var(--dim); }
  [data-look="3"] .tile.v { box-shadow: inset 0 0 0 1.5px var(--hot), 0 0 14px -3px var(--hot); }
  [data-look="3"] .tile.sel { background: var(--sub); box-shadow: none; }

  /* ============ 県の画面 ============ */
  #county { position: relative; z-index: 1; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .hero { position: relative; height: 86svh; min-height: 520px; overflow: hidden; }
  .hero .cutline { position: absolute; z-index: 3; left: 0; right: 0; bottom: -1px; }
  .hero .cutline svg { display: block; width: 100%; height: auto; }
  .hero .top { position: absolute; z-index: 4; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(14px + env(safe-area-inset-top)) 16px 0; }
  .back { font-size: 13px; font-weight: 900; letter-spacing: .08em; display: flex; align-items: center; gap: 9px; background: var(--lo); padding: 9px 12px 10px; }
  .back s { display: block; width: 9px; height: 9px; border-left: 3px solid var(--sub); border-bottom: 3px solid var(--sub); transform: rotate(45deg); margin-left: 3px; }
  .hero .top .lab { background: var(--lo); padding: 8px 10px; }
  .hero .ttl { position: absolute; z-index: 4; left: 14px; right: 0; bottom: 22%; }
  .hero .zy { font-family: "PingFang TC", "Hiragino Sans", sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .34em; color: var(--sub); margin-left: 4px; }
  .hero h1 { margin: 0; font-family: var(--disp); font-weight: var(--dw); letter-spacing: var(--dls); line-height: .94; font-size: min(46vw, 260px); margin-left: -.05em; white-space: nowrap; }
  .hero h1.l3 { font-size: min(31vw, 176px); }
  .hero .cap { position: absolute; z-index: 4; right: 12px; top: 27%; writing-mode: vertical-rl; font-family: var(--lab); font-size: 10.5px; font-weight: 700; letter-spacing: .26em; }
  .caprow { padding: 8px 16px 0; display: flex; justify-content: space-between; font-family: var(--lab); font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--dim); }
  .intro { margin: 0; padding: 22px 18px 0; font-size: 18px; line-height: 1.8; font-weight: 900; }
  .nums2 { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; column-gap: 28px; padding: 22px 18px 0; }
  .nums2 b { display: block; font-family: var(--num); font-weight: 900; font-size: 46px; line-height: 1; color: var(--sub); }
  .nums2 b small { font-size: 15px; font-family: var(--body); font-weight: 900; margin-left: 3px; color: var(--ink); }
  .nums2 span { display: block; margin-top: 6px; font-family: var(--lab); font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--dim); }
  .sec { padding: 44px 18px 0; }
  .sec > h3 { margin: 0 0 14px; font-family: var(--lab); font-size: 12px; font-weight: 700; letter-spacing: .2em; color: var(--dim); }
  /* 案内の動画= 共通の部品 parts/guide-player.(js|css)(正本= 作業フォルダ/_parts/guide-player/・2026-11-15)。ここは色を渡すのと、最後の札の見た目だけ */
  .player { --gp-panel: var(--lo); --gp-ink: var(--ink); --gp-accent: var(--sub); --gp-dim: var(--dim); --gp-hot: var(--hot); --gp-on-hot: var(--on-hot);
    --gp-stage-radius: var(--r) 0 0 0; --gp-bar-radius: 0 0 var(--r) 0; --gp-label-font: var(--lab); }
  .gp-ov.card { inset: 0 0 auto 0; height: 47%; background: var(--hot); color: var(--on-hot); display: flex; flex-direction: column; justify-content: center; padding: 30px 9% 0; }
  .gp-ov.card b { font-family: var(--disp); font-weight: var(--dw); font-size: min(9.4vw, 50px); line-height: 1.25; }
  .gp-ov.card i { font-style: normal; font-size: 12px; font-weight: 700; margin-top: 18px; line-height: 1.7; }
  .hint { margin: 10px 2px 0; font-size: 12px; color: var(--dim); line-height: 1.7; font-weight: 500; }
  #player.gp-sound + .hint.hm, #player.gp-sound + .hint .hm { display: none; }   /* 音が出ている間は「音の出し方」の案内を隠す(音ありで始められなかった時だけ見える) */
  .wait { position: relative; background: var(--lo); overflow: hidden; border-radius: var(--r) 0 0 0; }
  .wait canvas { display: block; width: 100%; height: auto; }
  .wait canvas.m { filter: var(--mapf); } .wait canvas.hi { position: absolute; left: 0; top: 0; height: 100%; opacity: .8; }
  .wait .tape { position: absolute; left: 0; top: 18px; background: var(--sub); color: var(--on-sub); padding: 8px 14px 9px; font-family: var(--disp); font-weight: var(--dw); font-size: 24px; }
  .wait .tape small { display: block; font-family: var(--lab); font-size: 10.5px; letter-spacing: .1em; font-weight: 700; margin-top: 2px; }
  .say { background: var(--ink); color: var(--lo); padding: 18px 18px 20px; margin-top: 2px; border-radius: 0 0 var(--r) 0; }
  .say .lab { opacity: .7; } .say p { margin: 8px 0 0; font-size: 18px; font-weight: 900; line-height: 1.6; }
  .spot { margin-bottom: 36px; }
  .spot .pic { aspect-ratio: 16 / 10; overflow: hidden; background: var(--bg2); border-radius: 0 var(--r) 0 0; }
  .spot .pic img { width: 100%; height: 100%; object-fit: cover; }
  .spot .row { display: grid; grid-template-columns: 46px 1fr; margin-top: 12px; }
  .spot .n { font-family: var(--num); font-weight: 900; font-size: 34px; line-height: 1; color: var(--sub); }
  .spot h4 { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.3; }
  .spot h4 small { display: block; font-family: var(--lab); font-size: 11px; letter-spacing: .12em; color: var(--dim); font-weight: 700; margin-top: 4px; }
  .spot .t { margin: 8px 0 0; font-size: 14px; line-height: 1.85; font-weight: 500; }
  .spot cite { display: block; font-style: normal; font-size: 10.5px; color: var(--dim); margin-top: 6px; }
  .studio { margin-top: 18px; background: var(--hot); color: var(--on-hot); padding: 36px 18px 40px; }
  .studio .lab { opacity: .8; }
  .studio .face { display: block; width: 112px; height: 112px; object-fit: cover; object-position: 50% 18%; margin: 0 0 18px; border: 3px solid var(--ink); background: var(--lo); }   /* 2026-11-14 ユーザー「RINKA のアイコン写真を載せてね」= 開始画像の確定の 1 枚の顔。ファイルが無い間は出さない */
  .studio h3 { margin: 10px 0 12px; font-family: var(--disp); font-weight: var(--dw); letter-spacing: var(--dls); font-size: 34px; line-height: 1.25; }
  .studio p { margin: 0 0 22px; font-size: 14px; line-height: 1.9; font-weight: 700; }
  .studio a { display: flex; justify-content: space-between; align-items: center; background: var(--lo); color: var(--ink); text-decoration: none; padding: 16px 18px; font-size: 15px; font-weight: 900; letter-spacing: .06em; }
  .pn { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px 0 calc(90px + env(safe-area-inset-bottom)); }
  .pn button { background: var(--bg2); padding: 18px 16px 20px; } .pn button + button { text-align: right; }
  .pn .lab { color: var(--dim); display: block; }
  .pn .home { grid-column: 1 / -1; text-align: center !important; background: var(--ink); color: var(--lo); font-size: 15px; font-weight: 900; letter-spacing: .08em; padding: 18px 16px; }
  .pn b { display: block; margin-top: 6px; font-family: var(--disp); font-weight: var(--dw); font-size: 28px; letter-spacing: var(--dls); }

  /* ============ 配色の切り替え(サイトの機能。3 つとも入れてある) ============ */
  #looks { position: fixed; z-index: 20; left: 0; top: calc(79px + env(safe-area-inset-top)); display: flex; align-items: stretch; background: var(--lo); color: var(--ink);
